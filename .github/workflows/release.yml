name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5 is required for npm Trusted Publishing (OIDC, no token).
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run build
          npm run test:integration
          npm run validate:packages
        env:
          REQUIRE_BUILD: '1'

      # With pending changesets: opens/updates the "Version Packages" PR (versions + CHANGELOG.md).
      # Otherwise: publishes every package version not yet on npm, pushes tags, creates GitHub releases.
      - name: Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional once Trusted Publishing is configured on npmjs.com for every package.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish to the MCP Registry
        if: steps.changesets.outputs.published == 'true'
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
